<header class="site-header polybar" th:fragment="header" xmlns:th="http://www.thymeleaf.org">
  <div class="polybar-inner">
    <!-- Левый блок: Воркспейсы bspwm (1..5) -->
    <div class="polybar-left">
      <a class="arch-logo" href="/groups" title="На главную (Alt+1)">
        <span class="arch-glyph">󰣇</span>
        <span class="wm-tag">bspwm</span>
      </a>
      <nav class="navigation workspaces" aria-label="Разделы приложения">
        <a href="/groups" data-ws="1" th:attr="aria-current=${activePage == 'groups'} ? 'page' : null">
          <span class="ws-num">1</span>Группы
        </a>
        <a href="/subjects" data-ws="2" th:attr="aria-current=${activePage == 'subjects'} ? 'page' : null">
          <span class="ws-num">2</span>Предметы
        </a>
        <a href="/students" data-ws="3" th:attr="aria-current=${activePage == 'students'} ? 'page' : null">
          <span class="ws-num">3</span>Студенты
        </a>
        <a href="/journal" data-ws="4" th:attr="aria-current=${activePage == 'journal'} ? 'page' : null">
          <span class="ws-num">4</span>Журнал
        </a>
        <a href="/reports" data-ws="5" th:attr="aria-current=${activePage == 'reports'} ? 'page' : null">
          <span class="ws-num">5</span>Отчёты
        </a>
      </nav>
    </div>

    <!-- Центральный блок: Системный статус в стиле Polybar -->
    <div class="polybar-center">
      <span class="poly-metric" title="Движок базы данных">
        <span class="poly-icon">⚡</span> SQLite:WAL
      </span>
      <span class="poly-sep">│</span>
      <span class="poly-metric" title="Текущая ветка интерфейса">
        <span class="poly-icon">󰣇</span> journal@edu.local
      </span>
    </div>

    <!-- Правый блок: Управление HUD, Палитра команд, Тема, Часы -->
    <div class="polybar-right">
      <button id="hud-toggle" class="poly-btn active" type="button" title="Показать/скрыть боковые подсказки с иллюстрациями (Клавиша ?)">
        <span>󰋖 HUD</span>
        <kbd>?</kbd>
      </button>
      <button id="cmd-palette-trigger" class="poly-btn" type="button" title="Командная палитра (Ctrl+K)">
        <span>󰘳 Cmd</span>
        <kbd>^K</kbd>
      </button>
      <button id="theme-toggle" class="poly-btn theme-toggle-btn" type="button" aria-label="Переключить тему оформления" title="Переключить тему (Alt+T)">
        <span class="theme-toggle-icon" aria-hidden="true">󰄛</span>
        <span class="theme-toggle-text">Dracula</span>
      </button>
      <span id="polybar-clock" class="poly-clock">00:00</span>
    </div>
  </div>
  <script type="module" src="/js/theme.js?v=4.0"></script>
</header>
